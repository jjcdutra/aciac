{% extends "base.html" %}
{% block title %}Meus dados — {{ associacao.NOME }}{% endblock %}

{% block content %}
<div class="container page-title">
  <h1>Meus dados</h1>
  <p class="muted"><a href="{% url 'associados:painel' %}">← Voltar ao painel</a></p>
</div>

<section class="section" style="padding-top:0">
  <div class="form-card wide">
    {% if associado %}
    <form method="post">
      {% csrf_token %}
      <div class="form-grid">
        <div class="form-group">
          <label>Razão social / Nome</label>
          <input type="text" value="{{ associado.razao_social }}" disabled>
        </div>
        <div class="form-group">
          <label>Documento</label>
          <input type="text" value="{{ associado.documento_mascarado }}" disabled>
        </div>
        <div class="form-group">
          <label for="nome_fantasia">Nome fantasia</label>
          <input type="text" id="nome_fantasia" name="nome_fantasia" value="{{ associado.nome_fantasia }}">
        </div>
        <div class="form-group">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" name="telefone" value="{{ associado.telefone }}" data-mask="telefone">
        </div>
        <div class="form-group full">
          <label for="logradouro">Logradouro</label>
          <input type="text" id="logradouro" name="logradouro" value="{{ associado.logradouro }}">
        </div>
        <div class="form-group">
          <label for="numero">Número</label>
          <input type="text" id="numero" name="numero" value="{{ associado.numero }}">
        </div>
        <div class="form-group">
          <label for="complemento">Complemento</label>
          <input type="text" id="complemento" name="complemento" value="{{ associado.complemento }}">
        </div>
        <div class="form-group">
          <label for="bairro">Bairro</label>
          <input type="text" id="bairro" name="bairro" value="{{ associado.bairro }}">
        </div>
        <div class="form-group">
          <label for="cidade">Cidade</label>
          <input type="text" id="cidade" name="cidade" value="{{ associado.cidade }}">
        </div>
        <div class="form-group">
          <label for="uf">UF</label>
          <input type="text" id="uf" name="uf" value="{{ associado.uf }}" maxlength="2" style="text-transform:uppercase">
        </div>
        <div class="form-group">
          <label for="cep">CEP</label>
          <input type="text" id="cep" name="cep" value="{{ associado.cep }}">
        </div>
        <div class="full">
          <button type="submit" class="btn btn-primary btn-block">Salvar alterações</button>
        </div>
      </div>
    </form>
    {% else %}
      <div class="empty-state">Perfil não encontrado.</div>
    {% endif %}
  </div>
</section>
{% endblock %}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-associacao}
      POSTGRES_USER: ${POSTGRES_USER:-associacao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-associacao}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # Em produção real, definir SECRET_KEY e ALLOWED_HOSTS no .env
      SECURE_SSL_REDIRECT: "False"
    command:
      - sh
      - -c
      - |
        uv run python manage.py migrate --noinput &&
        uv run python manage.py collectstatic --noinput &&
        uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile - --error-logfile -
    ports:
      - "8000:8000"
    volumes:
      - media_data:/app/media

volumes:
  pgdata:
  media_data:

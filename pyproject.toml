[project]
name = "associacao-comercial"
version = "1.0.0"
description = "Site da associação comercial: cadastro de associados, consultas CPF/CNPJ, serviços e pagamentos PIX."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.0",
    "django-environ>=0.11",
    "gunicorn>=22.0",
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "whitenoise>=6.6",
]

[dependency-groups]
dev = [
    "django-debug-toolbar>=4.4",
]

[tool.uv]
package = false

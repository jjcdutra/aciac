# Produção: app + Postgres, servido pelo Traefik existente (stack n8n) que
# cuida de HTTPS/Let's Encrypt. O app entra na rede n8n_default com labels
# Traefik — sem porta pública.
# Uso: docker compose -f docker-compose.prod.yml up -d --build
# Documentação completa: DEPLOY.md

name: associacao

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-associacao}
      POSTGRES_USER: ${POSTGRES_USER:-associacao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sem porta pública: só acessível pela rede interna do compose.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # O Traefik encerra o TLS e redireciona HTTP→HTTPS; não duplicar no Django.
      SECURE_SSL_REDIRECT: "False"
    command:
      - sh
      - -c
      - |
        uv run python manage.py migrate --noinput &&
        uv run python manage.py collectstatic --noinput &&
        uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile - --error-logfile -
    # Sem porta pública: roteado pelo Traefik via rede n8n_default.
    volumes:
      - media_data:/app/media
    networks:
      - default
      - n8n
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - traefik.http.routers.aciac.rule=Host(`dutratech.cloud`) || Host(`www.dutratech.cloud`)
      - traefik.http.routers.aciac.tls=true
      - traefik.http.routers.aciac.tls.certresolver=mytlschallenge
      - traefik.http.routers.aciac.entrypoints=web,websecure
      - traefik.http.services.aciac.loadbalancer.server.port=8000

networks:
  n8n:
    name: n8n_default
    external: true

volumes:
  pgdata:
  media_data:

# Produção: app + Postgres + Caddy (proxy reverso com HTTPS automático).
# Uso: docker compose -f docker-compose.prod.yml up -d --build
# Documentação completa: DEPLOY.md

name: associacao

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-associacao}
      POSTGRES_USER: ${POSTGRES_USER:-associacao}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Sem porta pública: só acessível pela rede interna do compose.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      # O Caddy encerra o TLS e redireciona HTTP→HTTPS; não duplicar no Django.
      SECURE_SSL_REDIRECT: "False"
    command:
      - sh
      - -c
      - |
        uv run python manage.py migrate --noinput &&
        uv run python manage.py collectstatic --noinput &&
        uv run gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 60 --access-logfile - --error-logfile -
    # Sem porta pública: só acessível via Caddy (rede interna).
    volumes:
      - media_data:/app/media

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-dutratech.cloud}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificados Let's Encrypt
      - caddy_config:/config
      - media_data:/media:ro # mídia servida direto pelo Caddy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:2019/config/"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
  media_data:
  caddy_data:
  caddy_config:
